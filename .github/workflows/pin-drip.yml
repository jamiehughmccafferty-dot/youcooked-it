name: pinterest rainbow drip

on:
  schedule:
    - cron: '0 11 * * *'   # daily, 11:00 UTC (~midday UK)
  workflow_dispatch: {}     # manual "run now" button

permissions:
  contents: write

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: post next pins from the rainbow queue
        run: node build/pin-post.mjs --count 4
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      - name: save progress pointer
        run: |
          git config user.name "pin-drip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add build/pin-post-log.json
          git diff --cached --quiet || (git commit -m "pin drip: progress" && git pull --rebase && git push)
